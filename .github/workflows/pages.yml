name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the page from README.md
        run: |
          mkdir -p _site
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/data:ro" \
            -v "$PWD/_site:/out" \
            pandoc/core:3.11.0@sha256:62518bfb6833705dc90a1634d8d879299bd820b3f74ad3b32fba8b618452553a \
            --from gfm --to html5 --standalone \
            --toc --toc-depth=2 \
            --metadata pagetitle="harden-ci - secure CI/CD instructions for AI agents" \
            --metadata lang=en \
            --css style.css \
            --include-after-body site/footer.html \
            --output /out/index.html \
            README.md
          cp site/style.css _site/style.css
          cp README.md _site/README.md

      - name: Check that the page links to the repository
        run: grep -qF 'href="https://github.com/SecH0us3/harden-ci"' _site/index.html

      - name: Check that the plain Markdown copy is published
        run: cmp README.md _site/README.md

      - name: Check that template braces from README are kept
        run: |
          grep -qF '{{.Digest}}' _site/index.html
          # the pattern is split so that Actions does not expand it as an expression
          grep -qF '$''{{ github.event.* }}' _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
