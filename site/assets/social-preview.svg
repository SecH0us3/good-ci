<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pill rect { fill: #151b23; stroke: #3d444d; stroke-width: 1.500; }
      .pill text { fill: #e6edf3; font-size: 26px; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1f6feb"/>

  <g transform="translate(80 96) scale(2.250)">
    <path d="M32 3 57 11.5V30c0 15.2-10 25.6-25 31C17 55.600 7 45.200 7 30V11.500z" fill="#1f6feb"/>
    <path d="m20.500 32.500 8.500 8.500 15-17" fill="none" stroke="#fff" stroke-width="6.500" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="256" y="172" fill="#ffffff" font-size="104" font-weight="700" letter-spacing="-2">harden-ci</text>
  <text x="258" y="228" fill="#9198a1" font-size="38" font-weight="400">Secure CI/CD instructions for AI agents</text>

  <text x="80" y="330" fill="#e6edf3" font-size="34" font-weight="400">Give this file to your coding agent. It audits the repository,</text>
  <text x="80" y="376" fill="#e6edf3" font-size="34" font-weight="400">shows you a report and fixes what you choose.</text>

  <g class="pill" transform="translate(80 432)">
    <g><rect width="104" height="52" rx="26"/><text x="52" y="35" text-anchor="middle">Tests</text></g>
    <g transform="translate(120 0)"><rect width="100" height="52" rx="26"/><text x="50" y="35" text-anchor="middle">SAST</text></g>
    <g transform="translate(236 0)"><rect width="212" height="52" rx="26"/><text x="106" y="35" text-anchor="middle">Dependencies</text></g>
    <g transform="translate(464 0)"><rect width="134" height="52" rx="26"/><text x="67" y="35" text-anchor="middle">Secrets</text></g>
    <g transform="translate(614 0)"><rect width="206" height="52" rx="26"/><text x="103" y="35" text-anchor="middle">Hash pinning</text></g>
    <g transform="translate(836 0)"><rect width="204" height="52" rx="26"/><text x="102" y="35" text-anchor="middle">Signed images</text></g>
  </g>
  <g class="pill" transform="translate(80 500)">
    <g><rect width="262" height="52" rx="26"/><text x="131" y="35" text-anchor="middle">Branch protection</text></g>
    <g transform="translate(278 0)"><rect width="248" height="52" rx="26"/><text x="124" y="35" text-anchor="middle">Signed commits</text></g>
    <g transform="translate(542 0)"><rect width="84" height="52" rx="26"/><text x="42" y="35" text-anchor="middle">IaC</text></g>
    <g transform="translate(642 0)"><rect width="108" height="52" rx="26"/><text x="54" y="35" text-anchor="middle">DAST</text></g>
  </g>

  <text x="1120" y="590" fill="#4493f8" font-size="30" font-weight="600" text-anchor="end">harden-ci.secmy.app</text>
</svg>
